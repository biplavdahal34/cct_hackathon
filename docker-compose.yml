services:
  web:
    build: .
    expose:
      - "8000"                 
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}   
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"                
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: unless-stopped