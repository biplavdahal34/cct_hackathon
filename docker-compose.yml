services:
  web:
    build: .
    expose:
      - "8000"                 
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - APIFY_TOKEN=${APIFY_TOKEN}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - KEY_ENCRYPTION_KEY=${KEY_ENCRYPTION_KEY}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-1}
      - REUSE_ANALYSIS_DAYS=${REUSE_ANALYSIS_DAYS:-7}
      - OXYLABS_USERNAME=${OXYLABS_USERNAME}
      - OXYLABS_PASSWORD=${OXYLABS_PASSWORD}
      # usage caps for the shared free-tier keys (see limits.py)
      - FREE_ANALYSES_PER_HOUR=${FREE_ANALYSES_PER_HOUR:-6}
      - FREE_FACEBOOK_PER_HOUR=${FREE_FACEBOOK_PER_HOUR:-2}
      - FREE_ANALYSES_PER_DAY_GLOBAL=${FREE_ANALYSES_PER_DAY_GLOBAL:-100}
      - FREE_FACEBOOK_PER_DAY_GLOBAL=${FREE_FACEBOOK_PER_DAY_GLOBAL:-15}
      - MAX_ANALYSIS_IMAGES=${MAX_ANALYSIS_IMAGES:-6}
      # report assistant caps (see chat.py)
      - CHAT_MESSAGES_PER_LISTING=${CHAT_MESSAGES_PER_LISTING:-10}
      - CHAT_WINDOW_HOURS=${CHAT_WINDOW_HOURS:-24}
      - CHAT_MESSAGES_PER_DAY_GLOBAL=${CHAT_MESSAGES_PER_DAY_GLOBAL:-300}
      - CALIBRATION_MIN_REPORTS=${CALIBRATION_MIN_REPORTS:-20}
      - PRICE_HISTORY_DAYS=${PRICE_HISTORY_DAYS:-400}
    volumes:
      - ./data:/app/instance
    restart: unless-stopped

  # daily price crawl for the public price guide; shares the database volume
  crawler:
    build: .
    command: sh -c "while true; do flask --app flask_app crawl-prices; sleep ${CRAWL_INTERVAL_SECONDS:-86400}; done"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - OXYLABS_USERNAME=${OXYLABS_USERNAME}
      - OXYLABS_PASSWORD=${OXYLABS_PASSWORD}
      - PRICE_HISTORY_DAYS=${PRICE_HISTORY_DAYS:-400}
    volumes:
      - ./data:/app/instance
    depends_on:
      - web
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: unless-stopped