# Request-rate limit per client IP: 10 req/s sustained, bursts up to 30 (a page
# with its thumbnails), then 429. Stops floods before they reach Flask.
limit_req_zone $binary_remote_addr zone=beat:10m rate=10r/s;
limit_req_status 429;

server {
    listen 80;

    proxy_connect_timeout 10s;
    proxy_send_timeout    180s;
    proxy_read_timeout    180s;

    client_max_body_size 5m;

    location / {
        limit_req zone=beat burst=30 nodelay;
        proxy_pass http://web:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}