<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}BEAT{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script>
  (function () { var t = null; try { t = localStorage.getItem("theme"); } catch (e) {}
    document.documentElement.dataset.theme = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); })();
</script>
</head>
<body>
{% import "_macros.html" as m %}
<div class="auth">
  <div class="auth-box">
    <a class="wordmark" href="{{ url_for('home') }}"><span class="mark">B</span><span class="w">BEAT</span></a>
    <div class="authcard">
      {% block card %}{% endblock %}
    </div>
    <a class="back" href="{{ url_for('home') }}">← Back to home</a>
  </div>
</div>
<script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
