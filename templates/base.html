<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>{% block title %}BEAT — Buyer's Evaluation & Assisting Tool{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script>
  /* apply the saved theme before first paint so nothing flashes */
  (function () { var t = null; try { t = localStorage.getItem("theme"); } catch (e) {}
    document.documentElement.dataset.theme = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); })();
</script>
</head>
<body>
{% import "_macros.html" as m %}

<header class="bar">
  <div class="bar-in">
    <a class="wordmark" href="{{ url_for('home') }}"><span class="mark">B</span><span class="w">BEAT</span></a>
    <nav class="nav" aria-label="Main">
      <a href="{{ url_for('home') }}" class="{{ 'on' if request.endpoint in ('home', 'analyze_url') }}">Home</a>
      <a href="{{ url_for('analyses') }}" class="{{ 'on' if request.endpoint in ('analyses', 'report') }}">Analyses</a>
      <a href="{{ url_for('price_guide') }}" class="{{ 'on' if request.endpoint in ('price_guide', 'price_line', 'price_variant') }}">Prices</a>
    </nav>
    <div class="right">
      <button class="iconbtn" type="button" data-theme-toggle title="Switch theme" aria-label="Switch theme">
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      {% if current_user.is_authenticated %}
        <a class="avatar" href="{{ url_for('account') }}" title="{{ current_user.username }} — account">{{ current_user.username[0]|upper }}</a>
      {% else %}
        <a class="btn quiet sm" href="{{ url_for('login') }}">Log in</a>
        <a class="btn primary sm" href="{{ url_for('register') }}">Create account</a>
      {% endif %}
    </div>
  </div>
</header>

<main class="content {% block wide %}{% endblock %}">
  {% block flashes %}{{ m.flashes() }}{% endblock %}
  {% block content %}{% endblock %}
</main>

{{ m.key_ack_dialog() }}
<script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
